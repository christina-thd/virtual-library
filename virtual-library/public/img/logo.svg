<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hoard Board: a fanned hand of four cards, one per category (game, book, series, movie). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a3d"/>
      <stop offset="1" stop-color="#08070c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="series" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="movie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <!-- one card, pointing up from the pivot at (256, 418); on the back cards the glyph sits in the top-left corner, which the fan leaves visible -->
    <g id="card">
      <rect x="186" y="150" width="140" height="210" rx="18"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>

  <circle cx="92" cy="110" r="5" fill="#ece8f4" opacity="0.7"/>
  <circle cx="424" cy="92" r="6" fill="#ece8f4" opacity="0.8"/>
  <circle cx="446" cy="200" r="4" fill="#ece8f4" opacity="0.55"/>
  <path d="M256 58l7 16 16 7-16 7-7 16-7-16-16-7 16-7z" fill="#f4c566"/>

  <g stroke="#120d1f" stroke-width="5" stroke-linejoin="round">
    <!-- game -->
    <g transform="rotate(-36 256 418)">
      <use href="#card" fill="url(#game)"/>
      <g transform="translate(196 166) scale(2.3)" fill="none" stroke="#120d1f" stroke-width="2" stroke-linecap="round">
        <path d="M6.5 11h4M8.5 9v4M15 12h.01M17.5 10h.01"/>
        <path d="M17.3 5H6.7a4 4 0 0 0-3.96 3.43l-.9 6.3a2.6 2.6 0 0 0 4.56 2.04L7.9 15h8.2l1.5 1.77a2.6 2.6 0 0 0 4.56-2.04l-.9-6.3A4 4 0 0 0 17.3 5z"/>
      </g>
    </g>
    <!-- book -->
    <g transform="rotate(-12 256 418)">
      <use href="#card" fill="url(#book)"/>
      <g transform="translate(196 166) scale(2.3)" fill="none" stroke="#120d1f" stroke-width="2" stroke-linecap="round">
        <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5z"/>
        <path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-4"/>
      </g>
    </g>
    <!-- series -->
    <g transform="rotate(12 256 418)">
      <use href="#card" fill="url(#series)"/>
      <g transform="translate(196 166) scale(2.3)" fill="none" stroke="#120d1f" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="7" width="18" height="13" rx="2"/>
        <path d="m8 3 4 4 4-4"/>
      </g>
    </g>
    <!-- movie -->
    <g transform="rotate(36 256 418)">
      <use href="#card" fill="url(#movie)"/>
      <g transform="translate(214 206) scale(3.5)" fill="none" stroke="#120d1f" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7.5 4v16M16.5 4v16M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21"/>
      </g>
    </g>
  </g>
</svg>
