name: "Hoard Board"
description: "Your movies, series, books, comics and games: what's pending and what you've finished"
version: "4.0.0"
slug: "virtual_library"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 3100
# Optional direct address (http://<homeassistant-ip>:3100/), e.g. for "Add to Home Screen" on a phone.
# Not needed for the Home Assistant sidebar or app.
ports:
  3100/tcp: 3100
  3101/tcp: 3101
ports_description:
  3100/tcp: "Web interface (not needed for the Home Assistant sidebar)"
  3101/tcp: "Secure web interface, with the ssl option (to install it as an app on Android)"
# Read-only access to the "ssl" folder, for Home Assistant's own certificate (see DOCS.md)
map:
  - ssl:ro
panel_icon: "mdi:treasure-chest"
panel_title: "Hoard Board"
options:
  tmdb_api_key: ""
  rawg_api_key: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  tmdb_api_key: "password?"
  rawg_api_key: "password?"
  ssl: bool
  certfile: str
  keyfile: str
